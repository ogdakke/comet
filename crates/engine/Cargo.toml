[package]
name = "zeron-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
zeron-proto.workspace = true
zeron-doc.workspace = true
zeron-sync.workspace = true
zeron-harness.workspace = true
zeron-studio.workspace = true
zeron-rpc.workspace = true
zeron-update.workspace = true
loro.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
notify.workspace = true
portable-pty.workspace = true
base64 = "0.22"
libc.workspace = true
gethostname.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
sha2.workspace = true
reqwest.workspace = true
ignore.workspace = true
nucleo-matcher.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
thumbhash = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
core-foundation = "0.10"

[dev-dependencies]
tempfile.workspace = true
tokio-tungstenite.workspace = true
rusqlite.workspace = true
# In-process registry server for the two-engine workspace integration tests.
zeron-sync = { workspace = true, features = ["mock-server"] }

[lints.rust]
# objc 0.2's `msg_send!`/`class!` probe `feature = "cargo-clippy"`; that
# value is not a zeron-engine Cargo feature, so rustc's check-cfg would
# otherwise warn on every AppKit call site.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
