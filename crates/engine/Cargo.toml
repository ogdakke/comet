[package]
name = "zeron-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Host-side answers to terminal queries (terminals/replies.rs).
alacritty_terminal.workspace = true
zeron-preview.workspace = true
zeron-proto.workspace = true
zeron-doc.workspace = true
zeron-sync.workspace = true
zeron-harness.workspace = true
zeron-studio.workspace = true
semver = "1"
zeron-rpc.workspace = true
zeron-update.workspace = true
zeron-notify.workspace = true
zeron-visual.workspace = true
loro.workspace = true
tokio.workspace = true
futures.workspace = true
zeron-term-link.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
notify.workspace = true
portable-pty.workspace = true
base64 = "0.22"
# Cloud runner identity: Ed25519 device key (already in the tree via rustls).
ring = "0.17"
toml = "0.8"
libc.workspace = true
gethostname.workspace = true
tokio-util = { workspace = true, features = ["rt", "io"] }
sha2.workspace = true
reqwest.workspace = true
ignore.workspace = true
fff-search.workspace = true
thumbhash = "0.1"
same-file = "1"
tempfile.workspace = true
# `show_image` reads a shown image's size from its header (already in the
# tree with these decoders via zeron-ui).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
core-foundation = "0.10"

[target.'cfg(windows)'.dependencies]
dunce = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
tracing-subscriber.workspace = true
zeron-mcp.workspace = true
zeron-harness = { workspace = true, features = ["installer-fixture"] }
# Paused-clock tests (the 30-minute idle reaper).
tokio = { workspace = true, features = ["test-util"] }
zip.workspace = true
tokio-tungstenite.workspace = true
rusqlite.workspace = true
# In-process registry server for the two-engine workspace integration tests.
zeron-sync = { workspace = true, features = ["mock-server"] }

[lints.rust]
# objc 0.2's `msg_send!`/`class!` probe `feature = "cargo-clippy"`; that
# value is not a zeron-engine Cargo feature, so rustc's check-cfg would
# otherwise warn on every AppKit call site.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
