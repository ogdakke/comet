[package]
name = "zeron-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
zeron-proto.workspace = true
similar.workspace = true
zeron-doc.workspace = true
zeron-engine.workspace = true
zeron-harness.workspace = true
zeron-rpc.workspace = true
zeron-studio.workspace = true
zeron-update.workspace = true
zeron-syntax.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui_tokio.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
pulldown-cmark.workspace = true
alacritty_terminal.workspace = true
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
thumbhash = "0.1"
unicode-segmentation.workspace = true
uuid.workspace = true
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
sha2.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
core-foundation = "0.10"
core-video = "0.5"

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
# objc 0.2's `msg_send!`/`class!` probe `feature = "cargo-clippy"`; that
# value is not a zeron-ui Cargo feature, so rustc's check-cfg would otherwise
# warn on every AppKit call site.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
