[workspace]
resolver = "2"
members = [
    "crates/theme",
    "crates/proto",
    "crates/doc",
    "crates/sync",
    "crates/harness",
    "crates/studio",
    "crates/engine",
    "crates/rpc",
    "crates/update",
    "crates/ui",
    "crates/syntax",
    "apps/zeron",
]

[workspace.package]
version = "0.2.30"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
zeron-proto = { path = "crates/proto" }
zeron-doc = { path = "crates/doc" }
zeron-sync = { path = "crates/sync" }
zeron-harness = { path = "crates/harness" }
zeron-studio = { path = "crates/studio" }
zeron-engine = { path = "crates/engine" }
zeron-rpc = { path = "crates/rpc" }
zeron-update = { path = "crates/update" }
zeron-ui = { path = "crates/ui" }
zeron-syntax = { path = "crates/syntax" }
zeron-theme = { path = "crates/theme" }

# CRDT
loro = "1.13"
# Wire protocol for the SessionRoom DO rooms — official Rust twin of the npm
# `loro-protocol` package the TS edge speaks (same monorepo, byte-identical
# frames, cross-checked by its js_snapshots tests).
loro-protocol = "0.3"

# gpui — comet's patched Zed fork, pinned for reproducible builds.
# upstream f14fea9 + edge-fade / backdrop-blur / GPU-budget commits through
# 5d1f83d (horizontal per-pixel EdgeFade for quads/images), then f6789b8
# EffectQuad and 761f12d (denser flowing dot lattice;
# Window::paint_effect_quad).
# Rebase when bumping the upstream rev. Earlier notes on that line:
# a6bf17c fixes BOTH wrap-rule copies (LineWrapper + line_layout's shaped-text
# duplicate); 14baea0 adds the EdgeFade primitive (Window::with_edge_fade);
# a6c1ad5 adds BackdropBlur + horizontal EdgeFade + glass fixes; 9b672fa
# bounds renderer GPU memory; b687328 adds ImageSource::evict; ac135eb adds
# device memory to the stats line; f596cde fixes destination alpha on
# transparent windows (Porter-Duff OVER); 53518c0 merges the edge-fade line;
# 8a8954c switches the macOS blurred view to UnderWindowBackground;
# 041a391 adds EdgeFadeEase (Quadratic default, optional Exponential).
gpui = { git = "https://github.com/ogdakke/zed", rev = "041a391d9149c37990e2a60f6481b3f780b688e5" }
gpui_platform = { git = "https://github.com/ogdakke/zed", rev = "041a391d9149c37990e2a60f6481b3f780b688e5", features = [
    "wayland",
    "x11",
    "font-kit",
    "runtime_shaders",
] }
gpui_tokio = { git = "https://github.com/ogdakke/zed", rev = "041a391d9149c37990e2a60f6481b3f780b688e5" }

# diffs
similar = "2"

# async / net
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
libc = "0.2"
gethostname = "1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
async-trait = "0.1"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
plist = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# storage
rusqlite = { version = "0.32", features = ["bundled", "backup"] }

# misc
# Global allocator on macOS only: libmalloc retains the churn high-water mark
# as permanent RSS - measured as the top residency cause in
# docs/memory-plan.md. Pinned to mimalloc v2: the crate's default (v3.3.2)
# has the same watermark pathology itself - transient streaming/render churn
# became permanent RSS (~6x glibc growth, daemon at 908MB for 7.3MB of docs,
# no idle recovery). Linux stays on glibc, which measured flat on the same
# workloads.
mimalloc = { version = "0.1", features = ["v2"] }
anyhow = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
notify = "7"
portable-pty = "0.8"
alacritty_terminal = "0.26"
pulldown-cmark = "0.12"
unicode-segmentation = "1"
fontdb = "0.23"
ttf-parser = "0.25.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
ignore = "0.4"
nucleo-matcher = "0.3"

[profile.release]
# Distribution profile (scripts/package-linux.sh): thin LTO buys most of fat
# LTO's size/speed win at a fraction of the link time; strip debug symbols.
lto = "thin"
strip = "symbols"

[profile.dev]
# gpui is slow unoptimized; match zed's approach for deps
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
