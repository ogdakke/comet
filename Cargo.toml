[workspace]
resolver = "2"
members = [
    "crates/theme",
    "crates/proto",
    "crates/preview",
    "crates/doc",
    "crates/sync",
    "crates/harness",
    "crates/studio",
    "crates/engine",
    "crates/rpc",
    "crates/update",
    "crates/ui",
    "crates/syntax",
    "apps/zeron",
]

[workspace.package]
version = "0.2.65"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
zeron-proto = { path = "crates/proto" }
zeron-preview = { path = "crates/preview" }
zeron-doc = { path = "crates/doc" }
zeron-sync = { path = "crates/sync" }
zeron-harness = { path = "crates/harness" }
zeron-studio = { path = "crates/studio" }
zeron-engine = { path = "crates/engine" }
zeron-rpc = { path = "crates/rpc" }
zeron-update = { path = "crates/update" }
zeron-ui = { path = "crates/ui" }
zeron-syntax = { path = "crates/syntax" }
zeron-theme = { path = "crates/theme" }

# CRDT
loro = "1.13"
# Wire protocol for the SessionRoom DO rooms — official Rust twin of the npm
# `loro-protocol` package the TS edge speaks (same monorepo, byte-identical
# frames, cross-checked by its js_snapshots tests).
loro-protocol = "0.3"

# GPUI follows upstream's extracted workspace. The patch below points every
# extracted crate, including gpui-base's dependencies, at our Zed fork with
# EffectQuad, Studio loading shaders, and EdgeFadeEase carried forward.
gpui = { git = "https://github.com/zeronsh/zui", rev = "aa009411c2dbfb39556bff1b1febed0512fdf609" }
gpui_platform = { git = "https://github.com/zeronsh/zui", rev = "aa009411c2dbfb39556bff1b1febed0512fdf609", features = [
    "wayland",
    "x11",
    "font-kit",
    "runtime_shaders",
] }
gpui_tokio = { git = "https://github.com/zeronsh/zui", rev = "aa009411c2dbfb39556bff1b1febed0512fdf609" }
gpui-base = { git = "https://github.com/zeronsh/gpui-component", rev = "94c1bbaf6311b9f36f5e7438aaf5aeadd38740da" }

# diffs
similar = "2"

# async / net
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
libc = "0.2"
gethostname = "1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
async-trait = "0.1"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
plist = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# storage
rusqlite = { version = "0.32", features = ["bundled", "backup"] }

# misc
# Global allocator on macOS only: libmalloc retains the churn high-water mark
# as permanent RSS - measured as the top residency cause in
# docs/memory-plan.md. Pinned to mimalloc v2: the crate's default (v3.3.2)
# has the same watermark pathology itself - transient streaming/render churn
# became permanent RSS (~6x glibc growth, daemon at 908MB for 7.3MB of docs,
# no idle recovery). Linux stays on glibc, which measured flat on the same
# workloads.
mimalloc = { version = "0.1", features = ["v2"] }
anyhow = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
notify = "7"
portable-pty = "0.8"
alacritty_terminal = "0.26"
pulldown-cmark = "0.12"
unicode-segmentation = "1"
unicode-width = "0.2"
fontdb = "0.23"
ttf-parser = "0.25.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
ignore = "0.4"
nucleo-matcher = "0.3"

[profile.release]
# Distribution profile (scripts/package-linux.sh): thin LTO buys most of fat
# LTO's size/speed win at a fraction of the link time; strip debug symbols.
lto = "thin"
strip = "symbols"

[profile.dev]
# gpui is slow unoptimized; match zed's approach for deps
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

# Preserve the fork's shader and EdgeFade APIs across the upstream GPUI extraction.
[patch."https://github.com/zeronsh/zui"]
collections = { git = "https://github.com/ogdakke/zed", rev = "f53b8aef51bbbfd5d17fc2c96618b6f3ff284c19" }
derive_refineable = { git = "https://github.com/ogdakke/zed", rev = "f53b8aef51bbbfd5d17fc2c96618b6f3ff284c19" }
gpui = { git = "https://github.com/ogdakke/zed", rev = "f53b8aef51bbbfd5d17fc2c96618b6f3ff284c19" }
gpui_linux = { git = "https://github.com/ogdakke/zed", rev = "f53b8aef51bbbfd5d17fc2c96618b6f3ff284c19" }
gpui_macos = { git = "https://github.com/ogdakke/zed", rev = "f53b8aef51bbbfd5d17fc2c96618b6f3ff284c19" }
gpui_macros = { git = "https://github.com/ogdakke/zed", rev = "f53b8aef51bbbfd5d17fc2c96618b6f3ff284c19" }
gpui_platform = { git = "https://github.com/ogdakke/zed", rev = "f53b8aef51bbbfd5d17fc2c96618b6f3ff284c19" }
gpui_shared_string = { git = "https://github.com/ogdakke/zed", rev = "f53b8aef51bbbfd5d17fc2c96618b6f3ff284c19" }
gpui_tokio = { git = "https://github.com/ogdakke/zed", rev = "f53b8aef51bbbfd5d17fc2c96618b6f3ff284c19" }
gpui_util = { git = "https://github.com/ogdakke/zed", rev = "f53b8aef51bbbfd5d17fc2c96618b6f3ff284c19" }
gpui_web = { git = "https://github.com/ogdakke/zed", rev = "f53b8aef51bbbfd5d17fc2c96618b6f3ff284c19" }
gpui_wgpu = { git = "https://github.com/ogdakke/zed", rev = "f53b8aef51bbbfd5d17fc2c96618b6f3ff284c19" }
gpui_windows = { git = "https://github.com/ogdakke/zed", rev = "f53b8aef51bbbfd5d17fc2c96618b6f3ff284c19" }
http_client = { git = "https://github.com/ogdakke/zed", rev = "f53b8aef51bbbfd5d17fc2c96618b6f3ff284c19" }
media = { git = "https://github.com/ogdakke/zed", rev = "f53b8aef51bbbfd5d17fc2c96618b6f3ff284c19" }
refineable = { git = "https://github.com/ogdakke/zed", rev = "f53b8aef51bbbfd5d17fc2c96618b6f3ff284c19" }
scheduler = { git = "https://github.com/ogdakke/zed", rev = "f53b8aef51bbbfd5d17fc2c96618b6f3ff284c19" }
sum_tree = { git = "https://github.com/ogdakke/zed", rev = "f53b8aef51bbbfd5d17fc2c96618b6f3ff284c19" }
util_macros = { git = "https://github.com/ogdakke/zed", rev = "f53b8aef51bbbfd5d17fc2c96618b6f3ff284c19" }
